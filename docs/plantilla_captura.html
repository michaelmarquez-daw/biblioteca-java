<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de biblioteca - sesión de consola</title>
<style>
    body {
        margin: 0;
        background: #d9d4c7;
        font-family: Consolas, "Cascadia Mono", monospace;
    }
    .ventana {
        margin: 24px;
        height: 752px;
        box-sizing: border-box;
        background: #1f1d1a;
        border: 1px solid #3a362f;
        display: flex;
        flex-direction: column;
    }
    .barra {
        background: #3a362f;
        color: #e8e2d4;
        font-size: 13px;
        padding: 7px 12px;
    }
    .contenido {
        display: flex;
        gap: 28px;
        padding: 14px 18px;
        overflow: hidden;
    }
    pre {
        margin: 0;
        flex: 1;
        color: #e8e2d4;
        font-size: 12.5px;
        line-height: 1.34;
        white-space: pre;
    }
</style>
</head>
<body>
<div class="ventana">
    <div class="barra">Símbolo del sistema - biblioteca-java</div>
    <div class="contenido">{{SESION}}</div>
</div>
</body>
</html>
